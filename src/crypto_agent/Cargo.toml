[package]
name = "cpqa-crypto-agent"
version = "0.3.1"
edition = "2021"
rust-version = "1.89"

[dependencies]
aes-gcm = "0.10"
base64 = "0.22"
dirs = "6"
libloading = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zeroize = "1"
uuid = { version = "1", features = ["serde"] }

[target.'cfg(windows)'.dependencies]
keyring = { version = "3.6.3", features = ["windows-native"] }
windows = { version = "0.62.2", features = ["Security_Credentials_UI", "Win32_System_WinRT", "Win32_UI_WindowsAndMessaging"] }
windows-future = "0.3"

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6.3", features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6.3", features = ["sync-secret-service", "crypto-rust", "vendored"] }
