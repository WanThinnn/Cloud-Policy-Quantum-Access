name: Build Crypto Agent installers

on:
  workflow_dispatch:
    inputs:
      origin:
        description: CPQA HTTPS origin
        required: true
        type: string
      upstream_tag:
        description: Upstream release tag (blank selects the latest release)
        required: false
        type: string

permissions:
  contents: read

env:
  CPQA_ORIGIN: ${{ inputs.origin }}
  CPQA_UPSTREAM_TAG: ${{ inputs.upstream_tag }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            target: windows-x86_64
          - runner: ubuntu-22.04
            target: linux-x86_64
          - runner: macos-15-intel
            target: macos-x86_64
          - runner: macos-15
            target: macos-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Select Rust toolchain
        run: rustup default 1.89.0
      - name: Verify extension message authorization
        run: node --test src/crypto_agent/extension/background.test.mjs src/crypto_agent/extension/safari-content.test.mjs
      - name: Build agent and installer
        shell: python
        run: |
          import os
          import subprocess
          import sys
          subprocess.run([
              sys.executable, "src/crypto_agent/package_agent.py",
              "--origin", os.environ["CPQA_ORIGIN"],
              "--ref", os.environ["CPQA_UPSTREAM_TAG"],
              "--output-dir", "src/crypto_agent/target/distribution",
          ], check=True)
      - name: Verify native messaging, denied requests and upstream ML-DSA
        run: python src/crypto_agent/test_packaged_agent.py src/crypto_agent/target/distribution ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: crypto-agent-${{ matrix.target }}
          path: src/crypto_agent/target/distribution
          if-no-files-found: error
